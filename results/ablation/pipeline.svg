<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title"><title id="title">Registration and camera localization inputs and outputs</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527182"/></marker></defs><rect width="1200" height="860" fill="#f5f7fa"/><g font-family="Arial,sans-serif" fill="#172b39"><text x="20" y="30" font-size="22" font-weight="bold">A. Controlled 0929 registration experiment</text><text x="20" y="690" font-size="22" font-weight="bold">B. Photo-to-camera pose — separate experiment</text><rect x="20" y="60" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="34" y="90" font-size="17" font-weight="bold">INPUT: 0929 Gaussian PLY</text><text x="34" y="120" font-size="14">Centers, covariance, opacity, SH</text><rect x="440" y="60" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="454" y="90" font-size="17" font-weight="bold">INPUT: 0929 LAS</text><text x="454" y="120" font-size="14">Reference XYZ in local metres</text><rect x="20" y="200" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="34" y="230" font-size="17" font-weight="bold">Frozen spatial split</text><text x="34" y="260" font-size="14">Training records / held-out records</text><rect x="440" y="200" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="454" y="230" font-size="17" font-weight="bold">PCA hypotheses</text><text x="454" y="260" font-size="14">Four proper rotation/scale starts</text><rect x="840" y="60" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="854" y="90" font-size="17" font-weight="bold">Semantic side branch</text><text x="854" y="120" font-size="14">Rendered/projection images → SegFormer</text><rect x="840" y="200" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="854" y="230" font-size="17" font-weight="bold">Labels mapped to 3D points</text><text x="854" y="260" font-size="14">Class-balanced scoring; no pose change</text><rect x="440" y="350" width="330" height="100" rx="6" fill="white" stroke="#8da5b3"/><text x="454" y="380" font-size="17" font-weight="bold">Three controlled branches</text><text x="454" y="410" font-size="14">PCA only / PCA + ICP / semantic + ICP</text><text x="454" y="433" font-size="13">Up to 500 steps / gate; stop reasons recorded</text><rect x="20" y="510" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="34" y="540" font-size="17" font-weight="bold">OUTPUT: transformation</text><text x="34" y="570" font-size="14">Local/global 4×4 matrix, scale, R, t</text><rect x="440" y="510" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="454" y="540" font-size="17" font-weight="bold">OUTPUT: held-out evaluation</text><text x="454" y="570" font-size="14">Median, P90, RMSE, thresholds, ablations</text><rect x="840" y="510" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="854" y="540" font-size="17" font-weight="bold">Separate BIM + baseline viewer</text><text x="854" y="570" font-size="14">Historical export + IFC; no BIM fitting</text><rect x="20" y="730" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="34" y="760" font-size="17" font-weight="bold">INPUT: calibrated query photo</text><text x="34" y="790" font-size="14">Reference photos + reference poses + LAS</text><rect x="440" y="730" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="454" y="760" font-size="17" font-weight="bold">SIFT/RootSIFT → 2D–3D pairs</text><text x="454" y="790" font-size="14">EPnP-RANSAC → LM refinement</text><rect x="840" y="730" width="330" height="90" rx="6" fill="white" stroke="#8da5b3"/><text x="854" y="760" font-size="17" font-weight="bold">OUTPUT: query camera pose</text><text x="854" y="790" font-size="14">Held-out reprojection checks / BIM overlay</text><polyline points="185,150 185,200" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="350,245 440,245" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="605,150 605,200" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="350,105 400,105 400,175 1005,175 1005,150" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="770,105 840,105" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1005,150 1005,200" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="605,290 605,350" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1005,290 1005,400 770,400" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,400 185,400 185,510" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="605,450 605,510" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="350,775 440,775" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><polyline points="770,775 840,775" fill="none" stroke="#527182" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="635" font-size="15">Held-out records are used only for evaluation. BIM is not an alignment target. Segmentation supplies labels, not a matrix.</text></g></svg>